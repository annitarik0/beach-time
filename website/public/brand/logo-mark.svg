<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Beach Time">
  <defs>
    <linearGradient id="bt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE2BE"/>
      <stop offset="1" stop-color="#F6EBDC"/>
    </linearGradient>
    <linearGradient id="bt-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6C24E"/>
      <stop offset="1" stop-color="#EE7F45"/>
    </linearGradient>
    <linearGradient id="bt-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A8E9A"/>
      <stop offset="1" stop-color="#127C8A"/>
    </linearGradient>
    <clipPath id="bt-round"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="bt-above"><rect width="1024" height="640"/></clipPath>
  </defs>
  <g clip-path="url(#bt-round)">
    <rect width="1024" height="1024" fill="url(#bt-sky)"/>
    <circle cx="512" cy="600" r="250" fill="url(#bt-sun)" clip-path="url(#bt-above)"/>
    <path d="M0 610 Q128 560 256 610 T512 610 T768 610 T1024 610 V1024 H0 Z" fill="url(#bt-sea)"/>
    <path d="M0 610 Q128 560 256 610 T512 610 T768 610 T1024 610" fill="none" stroke="#FFFCF7" stroke-width="26" stroke-linecap="round"/>
    <path d="M0 790 Q128 745 256 790 T512 790 T768 790 T1024 790 V1024 H0 Z" fill="#0B4F5C"/>
    <path d="M-20 790 Q128 745 256 790 T512 790 T768 790 T1044 790" fill="none" stroke="#D7ECEA" stroke-width="18" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
