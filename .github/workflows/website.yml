name: Publish website

# Builds this Next.js site and the Flutter web app from the beachtime-app repo,
# puts the app under /app/ and publishes both to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [app-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the app
        uses: actions/checkout@v4
        with:
          repository: annitarik0/beachtime-app
          path: _app

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Build the web app
        working-directory: _app
        run: |
          flutter pub get
          flutter build web --release --base-href "$NEXT_PUBLIC_BASE_PATH/app/"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the website
        run: |
          npm ci
          npm run build

      - name: Put the app inside the site
        run: |
          mkdir -p out/app
          cp -r _app/build/web/. out/app/
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
