name: Publish website

# Builds the Next.js site (website/) and the Flutter web app, puts the app
# under /app/ and publishes both to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Build the web app
        run: |
          flutter pub get
          flutter build web --release --base-href "$NEXT_PUBLIC_BASE_PATH/app/"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the website
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Put the app inside the site
        run: |
          mkdir -p website/out/app
          cp -r build/web/. website/out/app/
          touch website/out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
