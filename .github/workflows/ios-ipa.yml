# Builds an unsigned iPhone app (BeachTime.ipa) on a GitHub macOS machine.
# Download it from the run's "Artifacts" section, then install it with
# Sideloadly (signs it with your own Apple ID). See README > "On your iPhone".
name: Build iPhone app

on:
  workflow_dispatch: # "Run workflow" button on GitHub
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build for iPhone (no signing)
        run: flutter build ios --release --no-codesign

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry BeachTime.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BeachTime-ipa
          path: BeachTime.ipa
          retention-days: 30
