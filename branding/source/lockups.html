<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beach Time lockups</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("../fonts/BricolageGrotesque.ttf"); font-weight: 200 800; }
  html, body { margin: 0; background: transparent; }
  .row { display: flex; gap: 40px; padding: 40px; flex-wrap: wrap; align-items: flex-start; }
  .lockup { display: inline-flex; align-items: center; gap: 28px; padding: 24px; }
  .lockup img { width: 150px; height: 150px; display: block; }
  .lockup span {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 750; font-size: 120px;
    letter-spacing: -0.045em; line-height: 1; padding-bottom: 8px;
    font-variation-settings: "opsz" 96, "wdth" 100;
  }
  .ink span { color: #0F2A35; }
  .white span { color: #FFFFFF; }
  .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 26px; padding: 24px; }
  .stack img { width: 220px; height: 220px; }
  .stack span { font-family: "Bricolage Grotesque", sans-serif; font-weight: 750; font-size: 96px; letter-spacing: -0.045em; line-height: 1; }
  .icon { display: inline-block; }
  .icon img { display: block; }
</style>
</head>
<body>
  <div class="row">
    <div class="lockup ink" id="h-ink"><img src="../logo/beach-time-app-icon.svg" alt=""><span>Beach Time</span></div>
    <div class="lockup white" id="h-white"><img src="../logo/beach-time-app-icon.svg" alt=""><span>Beach Time</span></div>
    <div class="lockup ink" id="h-mark-ink"><img src="../logo/beach-time-mark-ink.svg" alt=""><span>Beach Time</span></div>
    <div class="lockup white" id="h-mark-white"><img src="../logo/beach-time-mark-white.svg" alt=""><span>Beach Time</span></div>
    <div class="stack ink" id="v-ink"><img src="../logo/beach-time-app-icon.svg" alt=""><span style="color:#0F2A35">Beach Time</span></div>
    <div class="stack white" id="v-white"><img src="../logo/beach-time-app-icon.svg" alt=""><span style="color:#fff">Beach Time</span></div>
  </div>
  <div class="row">
    <div class="icon" id="i512"><img src="../logo/beach-time-app-icon.svg" width="512" height="512" alt=""></div>
    <div class="icon" id="i180"><img src="../logo/beach-time-app-icon.svg" width="180" height="180" alt=""></div>
    <div class="icon" id="i64"><img src="../logo/beach-time-app-icon.svg" width="64" height="64" alt=""></div>
    <div class="icon" id="i32"><img src="../logo/beach-time-app-icon.svg" width="32" height="32" alt=""></div>
  </div>
</body>
</html>
